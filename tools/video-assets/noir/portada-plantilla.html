<!doctype html>
<!--
  Plantilla de PORTADA (1080×1920) en el mismo estilo noir 3D que los vídeos. El scaffolder la copia
  al proyecto como cover.html. Rellena las zonas EDITAR con el gancho del Frame 1 y un dato REAL de la
  guía (nunca inventado). Hasta 3 libros (portadas reales assets/img/<id>.jpg) en abanico 3D.
  Contenido dentro del 83% superior (≤ 1594px). Rasterizar con chrome --headless --screenshot.
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'DM Serif Display'; src: url("assets/fonts/DMSerifDisplay-Regular.woff2") format('woff2'); }
  @font-face { font-family: 'DM Sans'; src: url("assets/fonts/DMSans-Variable.woff2") format('woff2'); font-weight: 100 1000; }
  @font-face { font-family: 'Space Grotesk'; src: url("assets/fonts/SpaceGrotesk-Variable.woff2") format('woff2'); font-weight: 100 1000; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0c0809; }
  body { position: relative; font-family: 'DM Sans', sans-serif; color: #f3e9dc; }
  .l { position: absolute; inset: 0; }
  .bg { background: radial-gradient(ellipse 80% 55% at 50% 38%, #4a1020 0%, #1c0a0f 55%, #0c0809 100%); }
  .glow { position: absolute; left: 50%; top: 640px; width: 1300px; height: 1300px; margin: -650px 0 0 -650px; border-radius: 50%; background: radial-gradient(circle, rgba(200,40,70,0.4), transparent 60%); }
  .sweep { position: absolute; top: -400px; left: 200px; width: 600px; height: 2800px; transform: rotate(18deg); background: linear-gradient(90deg, transparent, rgba(255,220,200,0.10), transparent); }
  .vig { background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,0.75) 100%); }
  .pill { position: absolute; top: 120px; left: 50%; transform: translateX(-50%); padding: 14px 36px; border: 3px solid #f3e9dc; border-radius: 999px; background: rgba(12,8,9,0.6);
          font-family: 'Space Grotesk'; font-weight: 700; font-size: 32px; letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap; }
  .pill b { color: #ff5a7a; }
  .stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1594px; perspective: 2200px; perspective-origin: 50% 40%; }
  .book { position: absolute; left: 50%; top: 620px; width: 400px; height: 610px; margin: -305px 0 0 -200px; transform-style: preserve-3d; }
  .f { position: absolute; inset: 0; transform: translateZ(30px); background: center/cover; border-radius: 2px 8px 8px 2px; box-shadow: inset 6px 0 10px rgba(0,0,0,0.35); }
  .f::after { content: ''; position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,0.28), transparent 35%, transparent 70%, rgba(0,0,0,0.25)); }
  .sp { position: absolute; top: 0; left: 170px; width: 60px; height: 610px; transform: rotateY(-90deg) translateZ(200px); background: linear-gradient(90deg, #3a0c19, #8a1f3d 40%, #3a0c19); }
  .pg { position: absolute; top: 4px; left: 173px; width: 54px; height: 602px; transform: rotateY(90deg) translateZ(197px); background: repeating-linear-gradient(90deg, #efe4cf 0 2px, #d6c7ab 2px 3px); }
  .shadow { position: absolute; left: 50%; top: 955px; width: 620px; height: 80px; margin-left: -310px; border-radius: 50%; background: radial-gradient(ellipse, rgba(0,0,0,0.7), transparent 70%); }
  .hook { position: absolute; top: 1030px; left: 60px; right: 60px; text-align: center; font-family: 'DM Serif Display'; font-size: 104px; line-height: 1.02; text-shadow: 0 8px 40px rgba(0,0,0,0.9); }
  .hook em { font-style: normal; color: #ff5a7a; }
  .fact { position: absolute; top: 1330px; left: 50%; transform: translateX(-50%) rotate(-3deg); padding: 16px 30px; border: 6px solid #ff3d63; color: #ff3d63; background: rgba(12,8,9,0.9); border-radius: 12px;
          font-family: 'Space Grotesk'; font-weight: 800; font-size: 36px; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
  .cta { position: absolute; top: 1470px; width: 100%; text-align: center; font-family: 'Space Grotesk'; font-weight: 700; font-size: 34px; letter-spacing: 0.12em; }
  .cta b { color: #ff8fa5; }
</style>
</head>
<body>
  <div class="l bg"></div><div class="glow"></div><div class="sweep"></div><div class="l vig"></div>
  <div class="shadow"></div>
  <div class="stage" id="stage"></div>
  <!-- EDITAR: pill -->
  <div class="pill">Reseña · <b>sin spoilers</b></div>
  <!-- EDITAR: gancho = el del Frame 1; la clave en <em> -->
  <div class="hook">Si nunca has leído <em>a Gómez-Jurado</em></div>
  <!-- EDITAR: un dato REAL de la guía/ficha -->
  <div class="fact">Empieza por Reina roja</div>
  <div class="cta">Guía gratis en <b>empiezalibros.es</b></div>
  <script>
    // EDITAR: 1 a 3 portadas reales (assets/img/<id>.jpg); la primera va al centro y delante
    var PORTADAS = ['assets/img/cover.jpg'];
    var pos = [{ x: 0, z: 60, ry: -18, rz: -3 }, { x: -300, z: -120, ry: 28, rz: -8 }, { x: 300, z: -120, ry: -40, rz: 8 }];
    var h = '';
    PORTADAS.forEach(function (src, i) {
      var p = pos[i];
      h += '<div class="book" style="transform:translateX(' + p.x + 'px) translateZ(' + p.z + 'px) rotateX(6deg) rotateY(' + p.ry + 'deg) rotateZ(' + p.rz + 'deg)">' +
           '<div class="f" style="background-image:url(' + src + ')"></div><div class="sp"></div><div class="pg"></div></div>';
    });
    document.getElementById('stage').innerHTML = h;
  </script>
</body>
</html>
